# Builds and tests the fork on every push and pull request.
name: Fork build

on:
  push:
    branches: [android-user]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Test
        run: ./gradlew test --no-daemon
      - name: Build CLI distribution
        run: ./gradlew :maestro-cli:distZip --no-daemon
